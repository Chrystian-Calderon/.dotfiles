$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/wallpapers/kaoruko_waguri.jpg
    blur_passes = 1
}

# icon
image {
  monitor = eDP-1
  path = ~/Pictures/wallpapers/perfil_kaoruko_waguri.jpeg
  size = 100
  border_size = 2
  border_color = rgb(230, 230, 230)
  rounding = 75
  position = 0, 0
  halign = center
  valign = center
}

# label username
label {
    text = Hello, $USER
    font_size = 16
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.6) # no fill

    outer_color = rgb(230, 230, 230)
    check_color = rgb(230, 230, 230)
    fail_color = rgb(230, 230, 230)

    font_color = rgba(220, 220, 220, 1.0)

    fade_on_empty = false
    rounding = 14

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -150
    halign = center
    valign = center
}

# TIME
label {
    text = cmd[update:1000] echo $(date +%H)
    position = 0, -40
    font_size = 80
    halign = center
    valign = top
}

label {
    text = cmd[update:1000] echo $(date +%M)
    position = 0, -130
    font_size = 80
    halign = center
    valign = top
}

# DATE
label {
    monitor = eDP-1
    text = cmd[update:60000] date +"%A, %d %B" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -260
    halign = center
    valign = top
}

# buttons
image {
    monitor = eDP-1
    path = ~/.config/hypr/icons/reiniciar.png
    size = 30
    position = 50, 20
    border_size = 0
    halign = center
    valign = bottom
    onclick = exec, systemctl reboot
}

image {
    monitor = eDP-1
    path = ~/.config/hypr/icons/apagar.png
    size = 30
    position = 0, 20
    border_size = 0
    halign = center
    valign = bottom
    onclick = exec, systemctl poweroff
}

image {
    monitor = eDP-1
    path = ~/.config/hypr/icons/cerrar-sesion.png
    size = 30
    position = -50, 20
    border_size = 0
    halign = center
    valign = bottom
    onclick = exec, hyprctl dispatch exit
}